<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="logo-usl-crop.png" class="logo-img" alt="USL">
      <div class="brand-txt">
        <div class="brand-row">
          <strong>CS Simples</strong>
          <span class="ver-badge" id="ver-badge">v</span>
        </div>
        <small>Usina São Luiz • GEF 1.3.1</small>
      </div>
    </div>
    <label class="switch" title="Ativar / desativar extensão">
      <input type="checkbox" id="enabled" aria-label="Ativar extensão">
      <span></span>
    </label>
  </header>

  <div class="upd" aria-live="polite">
    <span class="upd-txt" id="upd-txt"></span>
    <button type="button" class="upd-btn" id="upd-btn">Verificar atualização</button>
  </div>

  <div class="quick-actions">
    <button id="dashNow" class="act-btn primary" title="Abrir o Dashboard de atalhos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Dashboard</span>
    </button>
    <button id="gefNow" class="act-btn" title="Trocar para GEF 1.3.1 agora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>GEF 1.3.1</span>
    </button>
    <button id="goNow" class="act-btn" title="Ir para Manutenção Automotiva">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.6-.6-.6-2.6z"/></svg>
      <span>Manutenção</span>
    </button>
    <button id="diag" class="act-btn icon-only" title="Diagnosticar tela (copia dados para suporte)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
    </button>
  </div>

  <main class="content">
    <section class="card">
      <div class="card-title">Navegação &amp; GEF 1.3.1</div>
      <label class="check"><input type="checkbox" id="dashboard"><span>Abrir Dashboard na tela inicial</span></label>
      <label class="check"><input type="checkbox" id="gefLogin"><span>Enviar GEF 1.3.1 junto com o login</span></label>
      <label class="check"><input type="checkbox" id="autoPilot"><span>Conferir GEF após login e trocar sozinho</span></label>
      <div class="field-inline">
        <input type="text" id="userName" class="txt" placeholder="Nome na saudação (ex.: Haroldo)" maxlength="30" aria-label="Nome na saudação">
      </div>
    </section>

    <section class="card">
      <div class="card-title">Relatórios &amp; Grades</div>
      <label class="check"><input type="checkbox" id="exportBar"><span>Barra de filtro rápido e exportação (CSV/Excel/Imprimir)</span></label>
      <label class="check"><input type="checkbox" id="rows1000"><span>Mostrar até 1000 linhas por página</span></label>
      <label class="check"><input type="checkbox" id="fitGrids"><span>Esticar relatórios na altura da tela</span></label>
      <label class="check"><input type="checkbox" id="stickyHeader"><span>Cabeçalho fixo ao rolar tabelas</span></label>
      <div class="check-grid">
        <label class="check"><input type="checkbox" id="zebra"><span>Listras alternadas</span></label>
        <label class="check"><input type="checkbox" id="hover"><span>Destacar linha</span></label>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Impressão de O.S. &amp; Telas</div>
      <label class="check"><input type="checkbox" id="osVerso"><span>Anexar RG AOO_001 no verso da O.S.</span></label>
      <label class="check"><input type="checkbox" id="osVersoPrint"><span>Abrir janela de impressão automaticamente</span></label>
      <label class="check"><input type="checkbox" id="cleanDialog"><span>Fundo limpo ao abrir janelas (ex.: Nova OS)</span></label>
      <label class="check"><input type="checkbox" id="cleanHome"><span>Ocultar gráficos pesados da tela inicial</span></label>
    </section>

    <section class="card">
      <div class="card-head-row">
        <span class="card-title">Tema &amp; Aparência</span>
        <div class="seg-group" role="group" aria-label="Tema">
          <button id="theme-light" class="seg-btn" type="button">☀️ Claro</button>
          <button id="theme-dark" class="seg-btn" type="button">🌙 Escuro</button>
        </div>
      </div>
      <div class="colors">
        <button data-color="#1a7a3a" style="background:#1a7a3a" title="Verde Usina" aria-label="Verde Usina"></button>
        <button data-color="#1f3158" style="background:#1f3158" title="Azul USL" aria-label="Azul USL"></button>
        <button data-color="#1565c0" style="background:#1565c0" title="Azul Royal" aria-label="Azul Royal"></button>
        <button data-color="#d97706" style="background:#d97706" title="Âmbar" aria-label="Âmbar"></button>
        <button data-color="#0f766e" style="background:#0f766e" title="Teal" aria-label="Teal"></button>
        <input type="color" id="primary" value="#1a7a3a" title="Cor personalizada" aria-label="Cor personalizada">
      </div>
      <div class="sliders">
        <div class="slider-row">
          <div class="slider-lbl"><span>Tamanho da fonte</span><strong><span id="fontVal">14</span>px</strong></div>
          <input type="range" id="fontSize" min="12" max="18" step="1" value="14" aria-label="Tamanho da fonte">
        </div>
        <div class="slider-row">
          <div class="slider-lbl"><span>Largura máxima</span><strong><span id="widthVal">1400</span>px</strong></div>
          <input type="range" id="maxWidth" min="1000" max="1800" step="50" value="1400" aria-label="Largura máxima">
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <button id="reset" type="button">↺ Restaurar padrão</button>
    <span id="status" role="status" aria-live="polite">✔ Alterações salvas</span>
  </footer>
<script src="popup.js"></script>
</body>
</html>
